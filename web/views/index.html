<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discord Soundboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    {{template "navbar" .}}

    <div class="gridlayout">
      {{range .}}
      <div class="card" >
	{{if .IconHash}}
	<img src="https://cdn.discordapp.com/icons/{{.ID}}/{{.IconHash}}.png" class="card-img-top" alt="guild icon">
	{{else}}
	<img src="..." class="card-img-top" alt="guild icon">
	{{end}}

	<div class="card-body">
	  <h5 class="card-title">{{.Name}}</h5>
	  <a href="/guild/{{.ID}}" class="btn btn-primary">Go to soundboards</a>
	</div>
      </div>
      {{end}}

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
