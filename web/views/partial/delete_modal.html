{{define "delete-modal"}}
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete Soundboard?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete <strong id="modalTrackName"></strong>?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
const deleteModal = document.getElementById('deleteModal')
deleteModal.addEventListener('show.bs.modal', e => {
    const btn = e.relatedTarget
    const trackID = btn.dataset.trackid
    const trackName = btn.dataset.trackname
    document.getElementById('modalTrackName').textContent = trackName
    document.getElementById('confirmDelete').onclick = () => {
        fetch(`/guild/{{.Guild.ID}}/track/${trackID}`, { method: 'DELETE' })
            .then(() => location.reload())
    }
})
</script>
{{end}}
